use_accelerator: False
delta: 0.01
use_early_stopping: True
trainer_device: "cuda:7"
trainer_use_gpu: True

valid_interval: 200
log_interval: 1
save_interval: 100
save_path: "src/kg4rd/kge/checkpoints/CompGCN_PreE_eval_Accel_20260204/model.pth"

ent_embed_path: "src/kg4rd/gcl/embeddings/GRACE_20251014/ent_embed.npz"