project: 'kg4rd'
name: 'CompGCN_PreE_eval_Accel_20260204'

in_path: 'src/kg4rd/kge/data/'
train_file: 'train2id.txt'
valid_file: 'valid2id.txt'
test_file: 'test2id.txt'

batch_size: 10000
neg_ent: 16
num_workers: 16
dim: 100
epochs: 1000
lr: 0.0001
adv_temperature: 1
opt_method: "adagrad"

