project: 'kg4rd'
name: 'RGCN_eval_Accel_20260202'

in_path: 'src/kg4rd/kge/data/'
train_file: 'train2id.txt'
valid_file: 'valid2id.txt'
test_file: 'test2id.txt'

batch_size: 2000
neg_ent: 16
num_workers: 16
dim: 500
num_layers: 2
epochs: 500
lr: 0.7857815410979511
adv_temperature: 3
opt_method: "adagrad"

test_batch_size: 10
tester_use_gpu: True
test_hits: [1, 3, 10, 30, 50]
tester_device: "cuda:5"

use_accelerator: False
delta: 0.01
use_early_stopping: True
trainer_device: "cuda:5"
trainer_use_gpu: True

valid_interval: 1
log_interval: 1
save_interval: 100
save_path: "src/kg4rd/kge/checkpoints/RGCN_eval_Accel_20260202/model.pth"