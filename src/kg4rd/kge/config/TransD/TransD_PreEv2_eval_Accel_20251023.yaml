# 多 GPU 训练评估 TransDv2 模型, 在补充后的图谱上训练和评估
# 使用 GCL 训练得到节点预嵌入
# 2025/10/23 创建, 对应 GCL 使用 GRACE 模型

project: 'kg4rd'
name: 'TransD_PreEv2_eval_Accel_20251023'

in_path: 'src/kg4rd/kge/data/'
train_file: 'train2id.txt'
valid_file: 'valid2id.txt'
test_file: 'test2id.txt'

batch_size: 500
neg_ent: 64
num_workers: 16
dim_e: 256
dim_r: 256
p_norm: 1
norm_flag: True
margin: 1.0
epochs: 1000
lr: 0.6
adv_temperature: 3.0
opt_method: "SGD"

test_batch_size: 10
tester_use_gpu: True
test_hits: [1, 3, 10, 30, 50]

trainer_use_gpu: False
use_accelerator: True
delta: 0.01
use_early_stopping: True

device: "cuda:0"

valid_interval: 50
log_interval: 1
save_interval: 50
save_path: "src/kg4rd/kge/checkpoints/TransD_PreEv2_eval_Accel_20251023.pth"

ent_embed_path: "src/kg4rd/gcl/embeddings/gcl_20251014/ent_embed.npz"