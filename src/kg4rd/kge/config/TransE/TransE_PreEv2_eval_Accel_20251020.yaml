project: 'kg4rd'
name: 'TransE_PreEv2_eval_Accel_20251020'

in_path: 'src/kg4rd/kge/data/'
train_file: 'train2id.txt'
valid_file: 'valid2id.txt'
test_file: 'test2id.txt'

batch_size: 1024
neg_ent: 64
num_workers: 16
dim: 256
p_norm: 1
norm_flag: True
margin: 1.0
epochs: 1000
lr: 0.5383
adv_temperature: 6.0
opt_method: "Adagrad"

test_batch_size: 10
tester_use_gpu: True
test_hits: [1, 3, 10, 30, 50]
tester_device: "cuda:1"

trainer_device: "cuda:1"
use_accelerator: True
delta: 0.01
use_early_stopping: True

valid_interval: 50
log_interval: 1
save_interval: 50
save_path: "src/kg4rd/kge/checkpoints/TransE_PreEv2_eval_Accel_20251020/model.pth"

ent_embed_path: "src/kg4rd/gcl/embeddings/gcl_20251014/ent_embed.npz"
